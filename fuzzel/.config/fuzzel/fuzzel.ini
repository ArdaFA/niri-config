# fuzzel — uygulama başlatıcı (Super+D veya Super+Space).
# Seçenekler: man 5 fuzzel.ini      Kontrol: fuzzel --check-config
# Her açılışta bu dosyayı yeniden okur; yenileme gerekmez.

[main]
# Renkler: `theme` komutunun ürettiği dosya.
include=~/.local/state/theme/fuzzel.ini
font=Departure Mono:pixelsize=11
prompt="> "
placeholder=ara
terminal=foot -e
layer=overlay
# Retro sade liste: simge yok. Simge istersen: icons-enabled=yes
icons-enabled=no
match-counter=yes
width=36
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=8

[border]
width=1
radius=6
