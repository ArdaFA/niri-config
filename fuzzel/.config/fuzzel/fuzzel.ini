# fuzzel — uygulama başlatıcı (Super+D veya Super+Space).
# Seçenekler: man 5 fuzzel.ini      Kontrol: fuzzel --check-config
# Her açılışta bu dosyayı yeniden okur; yenileme gerekmez.

[main]
font=Departure Mono:pixelsize=11
prompt="> "
placeholder=ara
terminal=foot -e
layer=overlay
# Retro sade liste: simge yok. Simge istersen: icons-enabled=yes
icons-enabled=no
match-counter=yes
width=36
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
# RRGGBBAA (başında # yok)
background=1d1a21f2
text=a397a8ff
prompt=f4a7b9ff
placeholder=6f6577ff
input=ede4eaff
match=f4a7b9ff
selection=332d39ff
selection-text=ede4eaff
selection-match=f4a7b9ff
border=f4a7b9ff

[border]
width=1
radius=6
