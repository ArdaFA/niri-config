# theme scripti tarafından üretildi ({{name}}). Elle düzenleme.
# Şablon: ~/dotfiles/themes/templates/swaylock.conf
# swaylock include desteklemediği için kilit ekranı ayarlarının TAMAMI bu şablonda.
# Her satır bir komut satırı seçeneğidir (başındaki -- olmadan); bkz. man swaylock.
# Renkler RRGGBB veya RRGGBBAA (başında # yok).

color={{bg.hex}}
font=Departure Mono
font-size=22
indicator-radius=64
indicator-thickness=4
indicator-idle-visible
indicator-caps-lock
ignore-empty-password
show-failed-attempts

inside-color={{bg.hex}}
ring-color={{accent.hex}}
line-color=00000000
separator-color=00000000
text-color={{fg.hex}}
key-hl-color={{accent2.hex}}
bs-hl-color={{urgent.hex}}

inside-ver-color={{bg.hex}}
ring-ver-color={{accent2.hex}}
text-ver-color={{accent2.hex}}

inside-wrong-color={{bg.hex}}
ring-wrong-color={{urgent.hex}}
text-wrong-color={{urgent.hex}}

inside-clear-color={{bg.hex}}
ring-clear-color={{muted.hex}}
text-clear-color={{subtle.hex}}

inside-caps-lock-color={{bg.hex}}
ring-caps-lock-color={{warn.hex}}
text-caps-lock-color={{warn.hex}}
caps-lock-key-hl-color={{accent2.hex}}
caps-lock-bs-hl-color={{urgent.hex}}
