# theme scripti tarafından üretildi ({{name}}). Elle düzenleme.
# Şablon: ~/dotfiles/themes/templates/alacritty.toml — alacritty.toml bunu import eder
# ([general] → import). Renkler foot.ini şablonundakiyle birebir aynı; açık Alacritty
# pencereleri `theme` çalışınca config'i yeniden yükleyerek anında güncellenir.

[colors.primary]
foreground = "{{fg}}"
background = "{{bg}}"

# foot cursor={{bg}} {{cursor}}: blok zemini arka plan renginde,
# altındaki karakter cursor renginde.
[colors.cursor]
cursor = "{{bg}}"
text = "{{cursor}}"

# foot selection-foreground/background: seçimin üstünde yazı düz kalır.
[colors.selection]
text = "{{fg}}"
background = "{{overlay}}"

[colors.normal]
black = "{{color0}}"
red = "{{color1}}"
green = "{{color2}}"
yellow = "{{color3}}"
blue = "{{color4}}"
magenta = "{{color5}}"
cyan = "{{color6}}"
white = "{{color7}}"

[colors.bright]
black = "{{color8}}"
red = "{{color9}}"
green = "{{color10}}"
yellow = "{{color11}}"
blue = "{{color12}}"
magenta = "{{color13}}"
cyan = "{{color14}}"
white = "{{color15}}"
