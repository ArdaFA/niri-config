# Kanagawa (wave) — https://github.com/rebelot/kanagawa.nvim
# Hokusai'nin "Kanagawa Oki Nami Ura" baskısından: sumi mürekkebi zemin, fuji beyazı yazı.
# Vurgu doğrudan paletin kendi sakura pembesi (sakuraPink).

name = "Kanagawa"
variant = "dark"

[ui]
bg      = "#1f1f28"  # sumiInk3
surface = "#2a2a37"  # sumiInk4
overlay = "#363646"  # sumiInk5
muted   = "#727169"  # fujiGray
subtle  = "#c8c093"  # oldWhite
fg      = "#dcd7ba"  # fujiWhite
accent  = "#d27e99"  # sakuraPink
accent2 = "#957fb8"  # oniViolet
urgent  = "#e46876"  # waveRed
warn    = "#e6c384"  # carpYellow
ok      = "#98bb6c"  # springGreen

[term]
color0  = "#16161d"
color1  = "#c34043"
