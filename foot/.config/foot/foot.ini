# foot terminal — temel ayarlar
# Ayarları kontrol etmek için: foot --check-config

[main]
# Renkler: `theme` komutunun ürettiği dosya.
include=~/.local/state/theme/foot.ini

# Departure Mono 11 px ve katlarında (22, 33…) piksel-mükemmel görünür.
# Fontun yalnızca Regular ağırlığı var: kalın/italik için de aynı yüz kullanılır
# (yapay kalınlaştırma piksel fontu bulanıklaştırır); kalın yazı parlak renkle gösterilir.
font=Departure Mono:pixelsize=11
font-bold=Departure Mono:pixelsize=11
font-italic=Departure Mono:pixelsize=11
font-bold-italic=Departure Mono:pixelsize=11
bold-text-in-bright=palette-based
pad=12x12 center

[scrollback]
lines=10000

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes
