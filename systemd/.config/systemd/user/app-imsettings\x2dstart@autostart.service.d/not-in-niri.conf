# imsettings-start (/etc/xdg/autostart/imsettings-start.desktop) niri'de giriş yöntemini
# IBus'a geçirip "ibus start" uyarısına yol açıyordu. niri oturumunda başlamasın
# (KDE'de eskisi gibi başlar).
# Klasör adındaki \x2d, birim adındaki "-" işaretinin systemd'deki kaçışıdır.

[Unit]
ConditionEnvironment=!XDG_CURRENT_DESKTOP=niri
