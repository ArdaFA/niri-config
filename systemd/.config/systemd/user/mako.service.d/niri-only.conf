# Paketteki mako.service için ek: mako yalnızca niri oturumunda başlasın.
# Bir uygulama KDE/GNOME'da bildirim gönderdiğinde mako D-Bus üzerinden
# tetiklenip masaüstünün kendi bildirim sisteminin yerini almasın diye.

#
# SwayNotificationCenter (swaync) kuruluysa bildirimleri o gösterir; mako yalnızca swaync
# kaldırılırsa yedek olarak başlar.

[Unit]
ConditionEnvironment=XDG_CURRENT_DESKTOP=niri
ConditionPathExists=!/usr/bin/swaync
