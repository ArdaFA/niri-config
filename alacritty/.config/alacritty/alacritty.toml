# Alacritty terminal — Ptyxis'in (Terminal uygulaması) görünümü.
# Ptyxis'teki Ayu Mirage paleti, Hack italik 11 punt, ince (ibeam) imleç ve opak
# zemin çok iyi duruyordu; amaç burada o görünümü birebir kopyalamak.
# Kaynaklar: renkler Ptyxis'in içindeki "Ayu Mirage" palet tanımından, font ve
# imleç ayarları `dconf dump /org/gnome/Ptyxis/` çıktısından.
# Renkler bu dosyanın içinde: `theme` komutu Alacritty'ye renk vermez, duvar
# kağıdı değişse de görünüm sabit kalır (foot ve ötekiler temayı izlemeye devam eder).
# Kontrol: ./check.sh (repo kökünde; alacritty'ye --check-config yok, bu yüzden orada).

[window]
# Ptyxis opak çizilir (profildeki "Transparency" ayarı 1.0): arkada duvar kağıdı
# ya da niri bulanıklığı görünmez. Saydam istersen 1.0'ın altına indirip
# Alacritty'yı foot kuralı (niri/rules.kdl) kapsamına geri ekleyebilirsin.
opacity = 1.0

# Ptyxis'in hücre dolgusu (Ptyxis CSS'i: üst 7, yan 6, alt 3 px). Alacritty
# yatay ve dikey için tek değer alır; 6/5 en yakın karşılık. dynamic_padding
# pencere ızgaraya tam oturmayınca artan alanı kenarlara bölüştürür,
# hücreler yarılmaz.
dynamic_padding = true

[window.padding]
x = 6
y = 5

[scrolling]
# foot'la aynı: 10.000 satır geri dönüş.
history = 10000

[font]
# Ptyxis'in fontu aynen: Hack'in *italik* yüzü, 11 punt. Hack'in kalın ve
# kalın-italik yüzleri de var; kalınlıklar yapay oluşturulmaz.
size = 11.0

[font.normal]
family = "Hack"
style = "Italic"

[font.bold]
family = "Hack"
style = "Bold Italic"

[font.italic]
family = "Hack"
style = "Italic"

[font.bold_italic]
family = "Hack"
style = "Bold Italic"

[cursor]
# Ptyxis imleci "system" kipinde yanıp söner: GTK'te sönme açık, periyot 1000 ms
# (500 ms görünür / görünmez), klavye durunca 10 saniye sonra sabitlenir.
blink_interval = 500
blink_timeout = 10

[cursor.style]
# Ptyxis'te cursor-shape='ibeam'; rengi paletin Cursor girdisinden: sarı.
shape = "Beam"
blinking = "On"

[mouse]
hide_when_typing = true

[terminal]
# OSC 52: uzak makineden (ssh) pane kopyalama. foot da varsayılan olarak yazmaya izin verir.
# Mutfağa (panoya okuma) kapalı: her uygulamanın panoyu okuyabilmesi risklidir.
osc52 = "OnlyCopy"

[colors]
# Ptyxis'te kalın yazı parlak renge geçmez (bold-is-bright kapalı).
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#1f2430"
foreground = "#cbccc6"

# İmleç rengi paletin Cursor girişi; imlecin altındaki karakter normal yazı renginde kalır.
[colors.cursor]
cursor = "#ffcc66"
text = "#cbccc6"

# Ptyxis seçimi GTK temasının yarı saydam mavisiyle çizer; Alacritty alfa kanalı
# desteklemediğinden en yakın opak karşılık: libadwaita'nın seçme mavisi.
[colors.selection]
text = "#ffffff"
background = "#3584e4"

[colors.normal]
black = "#1f2430"
red = "#ff3333"
green = "#bae67e"
yellow = "#ffa759"
blue = "#73d0ff"
magenta = "#d4bfff"
cyan = "#95e6cb"
white = "#cbccc6"

[colors.bright]
# Ayu Mirage'te "bright" kümesinde yalnızca gri (#707a8c) normalden farklı;
# ötekiler normal renklerin aynısı (palet tanımı böyle).
black = "#707a8c"
red = "#ff3333"
green = "#bae67e"
yellow = "#ffa759"
blue = "#73d0ff"
magenta = "#d4bfff"
cyan = "#95e6cb"
white = "#cbccc6"
